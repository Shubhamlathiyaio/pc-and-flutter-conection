services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: product_catalog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: ./backend
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres123
      DB_NAME: product_catalog
      API_PORT: 3000
      NODE_ENV: development
    ports:
      - "0.0.0.0:3000:3000"  # ← This allows external access
    volumes:
      - ./backend:/app
      - /app/node_modules

volumes:
  pgdata:
